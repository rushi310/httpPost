<div class="card post-card h-100 shadow-sm">
    <div class="card-header d-flex justify-content-between align-items-start">
        <h5 class="post-title mb-0">{{post.title}}</h5>
        <span class="badge badge-info ml-2">User {{post.userId}}</span>
    </div>
    <div class="card-body">
        <p class="mb-0">{{post.body}}</p>
    </div>
    <div class="card-footer d-flex justify-content-between">
        <button mat-stroked-button color="primary" (click)="startEdit(post)">Edit</button>
        <button mat-stroked-button color="warn" (click)="confirmDelete(post.id!)">Remove</button>
    </div>
</div>
