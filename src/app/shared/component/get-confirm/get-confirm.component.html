<h2 mat-dialog-title>Delete post</h2>
<mat-dialog-content>
    {{message || "Are you sure you want to delete this post?"}}
</mat-dialog-content>
<mat-dialog-actions align="end">
    <button mat-button (click)="closeDialog(false)">No</button>
    <button mat-raised-button color="warn" (click)="closeDialog(true)">Yes, delete</button>
</mat-dialog-actions>
